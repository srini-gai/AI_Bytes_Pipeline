# ============================================================================
# Srini on AI — Channel Pack v1
# ============================================================================
# Everything that makes this channel THIS channel vs. another channel using
# the same Engine v1. Domain knowledge (AI/tech education) and global engine
# rules live outside this file.
#
# Loaded by: engine.channel_config.load_channel(channel_id)
# ============================================================================

id: srini_on_ai
name: "Srini on AI"
tagline: "Practical AI, daily."
format: youtube_shorts
language_default: en
languages: [en]


# ── Brand ────────────────────────────────────────────────────────────────────

brand:
  colors:
    bg: "#050510"
    accent: "#a78bfa"
    accent2: "#34d399"
  logo: "srini-logo.png"            # relative to remotion/public/
  cta_text: "Follow Srini on AI for practical AI, daily."
  hashtag: "#SriniOnAI"
  default_title_pattern: "AI Bytes EP{episode:02d} #Shorts"


# ── Voice (ElevenLabs) ───────────────────────────────────────────────────────
# Voice B settings are LOCKED — never change without explicit approval.

voice:
  model_id: "eleven_multilingual_v2"
  output_format: "mp3_44100_128"
  defaults:
    stability: 0.42
    similarity_boost: 0.78
    style: 0.0
    speed: 1.05
    use_speaker_boost: true
  # env keys for voice_id (never store the ID itself in config)
  env_voice_id_key: "ELEVENLABS_VOICE_ID"
  duration_windows:
    en:
      min: 40.0
      max: 66.0
    ta:
      min: 40.0
      max: 65.0


# ── Script ───────────────────────────────────────────────────────────────────

script:
  persona: >-
    You are a YouTube Shorts scriptwriter for the Srini on AI channel.
    Srini on AI produces 60-second educational shorts explaining AI concepts
    to developers and founders.
  voiceover_word_range: [150, 175]
  voiceover_target_words: 155
  tags_always_include: "#SriniOnAI"
  theme_guide:
    danger:
      accent: "#ff3333"
      accent2: "#ff6600"
      overlay: "rgba(20,0,0,0.45)"
      pexels_mood: "dark dramatic red"
    calm:
      accent: "#60a5fa"
      accent2: "#e2e8f0"
      overlay: "rgba(0,10,30,0.40)"
      pexels_mood: "soft blue minimal calm"
    creative:
      accent: "#f59e0b"
      accent2: "#fb923c"
      overlay: "rgba(20,10,0,0.40)"
      pexels_mood: "warm golden creative"
    future:
      accent: "#22d3ee"
      accent2: "#818cf8"
      overlay: "rgba(0,10,20,0.45)"
      pexels_mood: "cyan space futuristic"
    technical:
      accent: "#22c55e"
      accent2: "#4ade80"
      overlay: "rgba(0,15,5,0.45)"
      pexels_mood: "green tech dark"
    energy:
      accent: "#a78bfa"
      accent2: "#34d399"
      overlay: "rgba(5,5,16,0.35)"
      pexels_mood: "purple neon dark"


# ── Visual Director ──────────────────────────────────────────────────────────

visual:
  remotion_composition_id: "AIBytesReel"
  default_theme:
    name: "energy"
    accent: "#a78bfa"
    accent2: "#34d399"
    overlay: "rgba(5,5,16,0.35)"
    pexels_mood: "purple neon dark"
  quality_gates:
    target_min_seconds: 45.0
    target_max_seconds: 60.0
    max_hook_seconds: 4.0
    max_cta_seconds: 3.0
  narration_pacing:
    min_wps: 2.0
    max_wps: 3.2
  weekly_diversity_guideline:
    native_motion: "~2/week"
    hybrid_generated: "~3/week"
  fingerprint_channel_key: "ai_bytes"


# ── Domain (content subject matter) ──────────────────────────────────────────
# Separates AI/tech-specific guidance from the generic engine capabilities.
# Another channel in a different domain would have different guidance here,
# ensuring no AI-specific content assumptions leak into non-AI channels.

domain:
  id: ai_technology
  description: >-
    AI and machine learning concepts explained to developers and founders.
  content_guidance: |
    DOMAIN-SPECIFIC TOPIC ROUTING:
    Choose diagram_type="token" when the topic involves:
    - Tokenization, tokens, context window, vocabulary, embeddings, text processing, or NLP —
      anything about how raw text gets split/counted/represented as discrete units.
    This takes priority over "sketch" whenever the concept is best shown as one example
    sentence breaking apart into token boxes, rather than a multi-component pipeline diagram.

    Choose diagram_type="sketch" when the topic involves:
    - A process with 3-6 distinct steps that connect to each other (not just a linear list —
      steps that branch, merge, or feed into a shared destination).
    - Any topic containing words: training, backpropagation, gradient, attention, transformer,
      neural network, RLHF.
    - Whenever a flow diagram would benefit from showing data transformations between named
      components (e.g. text -> tokens -> embeddings -> model), prefer "sketch" over "flow" so
      the transformation between each node is visible.
    Do not default to "flow", "hub_spoke", or the other types out of habit — check this routing
    list first. Only fall back to the other diagram types when none of the above conditions apply.

    DOMAIN-SPECIFIC DIAGRAM ASSOCIATIONS:
    hub_spoke   → MCP Protocol, AI Agents
    cluster     → Embeddings
    split_compare → Hallucination
    dial        → Temperature parameter
    bar_chart   → Few-shot prompting, LLM evaluation
    side_by_side → Local LLMs, Fine-tuning vs RAG
    flow        → RAG, Chain of Thought, Second Brain
    sketch      → Training, Backpropagation, Attention, Transformers, Neural networks, RLHF
    token       → Tokenization, context window, vocabulary, embeddings, NLP

    DOMAIN-SPECIFIC THEME ASSOCIATIONS:
    - danger:    problems, errors, hallucinations, risks
    - calm:      organisation, productivity, clarity, memory
    - creative:  prompting, ideas, writing, generation
    - future:    agents, automation, next-gen AI, robotics
    - technical: databases, architecture, code, vectors, search
    - energy:    general AI concepts, exciting breakthroughs
  visual_guidance: |
    DOMAIN-SPECIFIC VISUAL RULES:
    - Avoid default humanoid/robot imagery for every AI topic — vary visual metaphors.
    - AI-specific domain components available: TokenScene (text→token boxes→IDs),
      TokenStreamScene (tokens generate left-to-right), ContextWindowScene (rectangle fills
      with chunks), DocumentRetrievalScene (card fan→relevant items travel),
      CodeExecutionScene (code runs line-by-line).
    - Use these domain components when the AI concept semantically requires them, not as
      defaults for all topics.
    - Technical AI processes (training loops, inference pipelines, attention mechanisms) benefit
      from NATIVE mode with FlowScene/PipelineScene/DataFlowScene.
    - Abstract AI concepts (intelligence, creativity, emergence) benefit from GENERATED mode
      with editorial metaphor imagery.


# ── Publisher (YouTube) ──────────────────────────────────────────────────────

publisher:
  category_id: "28"                 # Science & Technology
  env_keys:
    en:
      channel_id: "YOUTUBE_CHANNEL_ID_EN"
      refresh_token: "YOUTUBE_REFRESH_TOKEN_EN"
      refresh_token_fallback: "YOUTUBE_REFRESH_TOKEN"
    ta:
      channel_id: "YOUTUBE_CHANNEL_ID_TA"
      refresh_token: "YOUTUBE_REFRESH_TOKEN_TA"
